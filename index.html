<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SpaceZgolf Neural v3.2 ⚡</title>
  <style>
    :root { --neon-green: #32D47A; --neon-glow: 0 0 10px #32D47A, 0 0 20px #32D47A; --bg-dark: #0a0a0a; --card-bg: #111; }
    body { background-color: var(--bg-dark); color: #fff; font-family: 'Courier New', monospace; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 2rem; box-sizing: border-box; }
    .neon-card { background: var(--card-bg); border: 1px solid #333; border-radius: 12px; padding: 2rem; text-align: center; min-width: 300px; max-width: 500px; width: 100%; position: relative; margin-bottom: 1.5rem; }
    .neon-card::before { content: ''; position: absolute; top: -1px; left: -1px; right: -1px; bottom: -1px; border-radius: 12px; z-index: -1; background: linear-gradient(45deg, #32D47A, transparent, #32D47A); opacity: 0.3; }
    h1 { font-size: 1.2rem; margin-bottom: 0.5rem; color: #888; text-transform: uppercase; letter-spacing: 2px; }
    .metric-label { font-size: 0.8rem; color: #666; margin-top: 1rem; }
    .metric-value { font-size: 2.5rem; font-weight: bold; color: var(--neon-green); text-shadow: var(--neon-glow); margin: 0.5rem 0; }
    .pulse-indicator { width: 10px; height: 10px; background-color: var(--neon-green); border-radius: 50%; display: inline-block; box-shadow: var(--neon-glow); animation: pulse 2s infinite; margin-left: 10px; }
    @keyframes pulse { 0% { transform: scale(0.95); opacity: 0.7; } 50% { transform: scale(1.1); opacity: 1; } 100% { transform: scale(0.95); opacity: 0.7; } }
    .lb-row { display: flex; justify-content: space-between; align-items: center; background: var(--card-bg); border: 1px solid #222; border-radius: 8px; padding: 0.75rem 1rem; margin-bottom: 0.5rem; font-size: 0.85rem; max-width: 500px; width: 100%; }
    .lb-rank { color: #555; width: 24px; }
    .lb-module { color: #fff; flex: 1; text-align: left; margin-left: 0.5rem; }
    .lb-di { color: var(--neon-green); text-shadow: var(--neon-glow); font-weight: bold; }
    .lb-signal-green { color: #32D47A; } .lb-signal-yellow { color: #f5c518; } .lb-signal-red { color: #ff4444; }
    .footer-text { margin-top: 1rem; font-size: 0.7rem; color: #444; text-align: center; }
  </style>
</head>
<body>
  <div class="neon-card">
    <h1>SystemZ Dominance <span class="pulse-indicator"></span></h1>
    <div class="metric-label">Leading Module</div>
    <div id="dominance-module" class="metric-value" style="font-size:1.8rem;">INITIALIZING...</div>
    <div class="metric-label">Dominance Index</div>
    <div id="dominance-index" class="metric-value">0.0000</div>
    <div style="margin-top:2rem;font-size:0.7rem;color:#444;">LIVE FEED // 60s UPDATE // v3.2</div>
  </div>
  <div id="leaderboard-rows" style="width:100%;max-width:500px;"></div>
  <div class="footer-text" id="last-update">Connecting...</div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
